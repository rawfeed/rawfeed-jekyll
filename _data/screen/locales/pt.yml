resume:
  buttons:
    print:
      text: imprimir
  sidebar:
    contact:
      caption: Contato
    personal_details:
      caption: Dados pessoais
      items:
        - title: Nascimento
        - title: Cidade
        - title: Estado
        - title: Nacionalidade
        - title: CNH
    languages:
      caption: Idiomas
      names:
        - value: Inglês
        - value: Português
        - value: Espanhol
