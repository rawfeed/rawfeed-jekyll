      caption: Formação
    skills:
      caption: Competências
      section:
        - group: Sistema operacional
        - group: Programação
        - group: Frameworks
        - group: DevOps
        - group: Outros
  body:
    summary:
      caption: Resumo
      content: |-
        Engenheiro de Software e pesquisador sênior com **8 anos de experiência** em todo o ciclo de desenvolvimento de sistemas. Experiência com linguagens de alto desempenho (**Rust**, **C++**, **Python**) e frameworks front-end (**React**). Foco em otimização de sistemas, com **redução de latência de 20%** em novos módulos e pesquisa aplicada na Microsoft.
    experience:
      caption: Experiência
      section:
        - role: Engenheiro de Software
          description: Otimização de backend e infraestrutura
          details: |-
            - Desenvolvi e lancei o **Module X**, reduzindo a **latência em 20%** no backend e aumentando a **satisfação dos usuários (KPIs)**.
            - Aprimorei o pipeline **CI/CD** para **Go** e **C++** com **Kubernetes** e **Docker**, acelerando as implantações em **15%**.
            - Liderei a migração de **microsserviços legados** para **TypeScript** e **Angular**, criando uma arquitetura mais escalável e fácil de manter.
        - role: Pesquisador
          details: |-
            - Conduzi pesquisa e desenvolvimento do **algoritmo Y** com **Python** e **TensorFlow**, reduzindo a taxa de erro em **10%**.
            - Publiquei dois artigos sobre modelos de **Machine Learning** e Processamento de Linguagem Natural (**NLP**).
            - Colaborei na implantação de modelos **Keras** e **Matlab** em produção, alcançando milhões de usuários.
    certificates:
      caption: Certificados
      section:
        - period:
            hours: 20 horas
        - period:
            hours: 19 horas
    publications:
      caption: Publicações
      section:
        - title: Apresentação dos recursos do chip F47X1
          conference: Conferência Tech Central Park, 2016
    projects:
      caption: Projetos
      section:
        - title: Suporte ao chip F47X1 no kernel Linux
          details: |-
            - Implementei o suporte ao chip F47X1 para reconhecer aplicativos macOS com conexão plug-and-play via USB 3.1.
        - title: Ferramenta de reconhecimento facial no Gemini
          details: |-
            - Com um grupo de quatro pessoas, pesquisei a nova versão do Gemini e o reconhecimento facial em dispositivos móveis.
    volunteering:
      caption: Voluntariado
      section:
        - role: Professor de IA
          company: Escola de Engenharia Seeds of Tomorrow
          details: |-
            - Liderei uma turma de estudantes de **Engenharia da Computação** em um curso moderno de **IA**, com mais de **170 horas** de aulas.
    markdown:
      caption: Observações
      content: |-
        - Liderei uma turma de estudantes de **Engenharia da Computação** em um curso moderno de **IA**, com mais de **170 horas** de aulas.
