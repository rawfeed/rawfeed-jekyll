projects:
  - slug: argvus
    category: Desktop
    description: Um ambiente desktop completo focado no Hyprland e criado para desenvolvedores.
  - slug: tildr
    category: Gerenciador de dotfiles
    description: Gerencie e reproduza declarativamente seu diretório pessoal.
  - slug: dotctrl
    category: Gerenciador de dotfiles
    description: Um gerenciador de dotfiles para sistemas Unix.
  - slug: smog
    category: Privacidade
    description: Sobrescreve arquivos, diretórios e volumes com ruído ilegível.
  - slug: shred-extension-rs
    category: Privacidade
    description: Uma extensão leve para excluir arquivos com segurança no Nautilus e Thunar.
  - slug: seedctl
    category: Criptografia
    description: Um gerador de carteiras de criptomoedas multichain.
  - slug: rs2f
    category: Segurança
    description: Ferramentas online para auditoria de senhas e autenticação de dois fatores.
  - slug: backdour
    category: Segurança
    description: Projeto multiplataforma de pesquisa em segurança com servidor C2 PostgreSQL.
  - slug: rawfeed-jekyll
    category: Web
    description: Um tema Jekyll com interface de terminal e carregamento rápido.
  - slug: jektify
    category: Web
    description: Um plugin Spotify para adicionar faixas, playlists, álbuns e artistas a sites Jekyll.
