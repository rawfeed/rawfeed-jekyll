    socials: Show configured social links
    contact: Open the configured contact page
    theme: Set dark/light or toggle the current theme
    lang: Change to a supported language code
    about: Show the home page introduction
    date: Print the current date and time
    clear: Clear terminal output
    find: Search pages and posts; show matching links
    shred: Run the screen wipe effect
    home: Navigate to the home page
    scan: Toggle scanlines
    boot: Replay the startup animation
    echo: Print supplied text
    whoami: Print the configured terminal user
    neofetch: Show theme, language, and page count
    exit: Close the terminal
