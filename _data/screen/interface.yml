  # Add commands with static responses. Built-in commands can also be overridden.
  commands:
    greet: Welcome to the Rawfeed Jekyll terminal.
  command_help:
    help: Show all commands and descriptions
    ls: List configured pages, posts, and pixels
    open: Open a page by slug or URL
