# Shared TUI configuration. Text and behavior can be customized without editing JS.
interface:
  theme: dark
  clock: true
  search_limit: 50
  boot_duration: 1850
  shred_pass_duration: 850
  shred_hold_duration: 420
  shred_fade_duration: 520
  shred_line_height: 18
  shred_char_width: 7.8
  effects:
    scan: false
    boot: true
  shortcuts:
    menu: m
    search: '/'
    settings: s
    terminal: ':'
    help: '?'
    quit: q
