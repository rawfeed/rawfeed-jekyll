# Rawfeed - Home Page Content & Texts

# section: [header]
header:
  title: hey, i'm rawfeed-jekyll!
  description: "A minimal, batteries-included Jekyll CMS"
  width: 860 # default: 860
  # your website image or logo
  avatar:
    open: true
    flip: true
    # note: the image (.jpg|.png) will be searched in the directory: assets/images/
    image:
      front:
        light: "/assets/images/avatars/light.png"
        dark: "/assets/images/avatars/dark.png"
      back: "/assets/images/avatars/back.png"
  # menu: use emoji unicode 6.0, to have greater compatibility
  menu:
    title: "menu"
    # default: 🏠📝🔍🔖📰 legacy: ⌂✐⌕▮▤
    home:
      emoji: "🏠"
      title: "/home"
    blog:
      emoji: "📝"
      title: "weblog"
      subtitle: "posts"
      search:
        emoji: "🔍"
        title: "search"
      tags:
        emoji: "🔖"
        title: "tags"
      feed:
        emoji: "📰"
        title: "feed"
    pixels:
      emoji: "📷"
      title: "pixels"
    pub:
      emoji: "📂"
      title: "pub"

# section: [home]
home:
  terminal:
    enable: true
    user: "rawfeed"
    hostname: "linux"
    welcome: " type 'help'"
    error: ": command not found."
    no_socials: "No socials found"
    help:
      description: |
        Use the commands below:
      commands:
        title: "Commands:"
        description: "Description:"
      menu: |
        about ------------- A brief summary about 'rawfeed'
        socials ----------- Links to my active social networks
        clear ------------- Clear the terminal screen (or press Esc)
        date -------------- Print the system date and time
        help -------------- Print this menu

# section: [social network]
# note: if you want more, just add more "title" and "url".
socials:
  enable: true
  description:
    text: |
      These are my social networks:
    terminal:
      about:
        description: |
          If you want to know our other links, use the "socials" command.
      command:
        description: |
          Click on a link and go directly to my social network:
  links:
    - title: github
      url: https://github.com/rawfeed/rawfeed-jekyll

    - title: rubygems
      url: https://rubygems.org/gems/rawfeed
