changelog:
  path: CHANGELOG.md
  title: "Changelog"
  intro: "All notable changes to this project are recorded in this file."
  keep_unreleased: true

commit_pattern: '^(?<type>feat|fix|docs|style|refactor|perf|chore|BREAKING)(?:\((?<scope>[^)]+)\))?: (?<description>.+)$'

tag_pattern: '^v(?<version>\d+\.\d+\.\d+)$'

sections:
  - title: "Added"
    types:
      - feat
      - feature
  - title: "Fixed"
    types:
      - fix
  - title: "Changed"
    types:
      - perf
      - refactor
      - docs
      - style
      - chore
  - title: "Removed"
    types:
      - BREAKING
