name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    env:
      RAWFEED_DEV_PATH: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Check Ruby syntax
        run: ruby -c lib/rawfeed.rb

      - name: Validate gem loads
        run: bundle exec ruby -Ilib -e 'require "rawfeed"; puts "rawfeed v#{Rawfeed::VERSION} loaded"'

      - name: Run RSpec tests
        run: bundle exec rspec

      - name: Build site with theme
        run: bundle exec rawfeed build --destination .site_build

      - name: Build gem package
        run: gem build rawfeed.gemspec

      - name: Test backup command
        env:
          GEM_LIB: ${{ github.workspace }}/lib
        run: |
          mkdir -p /tmp/test-backup-site/_posts /tmp/test-backup-site/_pages
          echo "post" > /tmp/test-backup-site/_posts/hello.md
          echo "page" > /tmp/test-backup-site/_pages/about.md
          cp Gemfile Gemfile.lock /tmp/test-backup-site/
          cd /tmp/test-backup-site
          bundle install --jobs 4 --retry 3 --quiet
          bundle exec ruby -e "
            \$LOAD_PATH.unshift(ENV['GEM_LIB'])
            require 'rawfeed/command/backup'
            Rawfeed::Backup.site('-d', '/tmp')
          "
          ls -1 /tmp/backup-*.zip
          echo "Backup test passed"

      - name: Test rawfeed new creates a valid site
        run: |
          bundle exec rawfeed new /tmp/test-new-site --force
          cd /tmp/test-new-site
          cat > Gemfile << 'GEMFILE'
          source "https://rubygems.org"
          gem "rawfeed", path: "${{ github.workspace }}"
          GEMFILE
          rm -f Gemfile.lock
          bundle config set frozen false
          bundle install --jobs 4 --retry 3
          bundle exec rawfeed build
          echo "rawfeed new test passed"

  release:
    name: GitHub Release and CHANGELOG
    needs: [test]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-ci') && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install dependencies
        env:
          RAWFEED_DEV_PATH: ${{ github.workspace }}
        run: bundle install --jobs 4 --retry 3

      - name: Get version and check if already released
        id: version
        run: |
          VERSION=$(ruby -Ilib -e 'require "rawfeed/core/version"; puts Rawfeed::VERSION')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ALREADY_RELEASED=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping release."
          else
            echo "ALREADY_RELEASED=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG not found, will create release."
          fi

      - name: Build gem
        if: steps.version.outputs.ALREADY_RELEASED == 'false'
        run: gem build rawfeed.gemspec

      - name: Push to RubyGems
        if: steps.version.outputs.ALREADY_RELEASED == 'false'
        uses: rubygems/release-gem@v1
        with:
          api-key: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Create GitHub Release
        if: steps.version.outputs.ALREADY_RELEASED == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          BASE="${{ github.server_url }}/$REPO"

          NOTES=$(gh api "repos/$REPO/releases/generate-notes" \
            --field tag_name="$TAG" \
            --field target_commitish="${{ github.sha }}" \
            --jq '.body')

          printf '%s\n' \
            '## Summary' \
            '' \
            "rawfeed v${VERSION} is now available. See the [CHANGELOG](${BASE}/blob/main/CHANGELOG.md) for details." \
            '' \
            '### Upgrade' \
            '' \
            'To upgrade an existing site, update your `Gemfile`:' \
            '' \
            '```ruby' \
            "gem \"rawfeed\", \"~> ${VERSION}\"" \
            '```' \
            '' \
            'Then run:' \
            '' \
            '```bash' \
            'bundle install' \
            '```' \
            '' \
            '---' \
            '' \
            "${NOTES}" \
            > /tmp/release-body.md

          gh release create "$TAG" \
            --title "rawfeed v${VERSION}" \
            --repo "$REPO" \
            --notes-file /tmp/release-body.md \
            rawfeed-*.gem

      - name: Generate CHANGELOG
        if: steps.version.outputs.ALREADY_RELEASED == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag v${{ steps.version.outputs.VERSION }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG
        if: steps.version.outputs.ALREADY_RELEASED == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase
          git stash pop
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: update CHANGELOG for v${{ steps.version.outputs.VERSION }} [skip ci]"
          git push
