name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          RAWFEED_DEV_PATH: ${{ github.workspace }}

      - name: Log Ruby and bundler versions
        run: |
          ruby --version
          bundle --version

      - name: Validate Ruby load
        run: bundle exec ruby -Ilib -e 'require "rawfeed"; puts Rawfeed::VERSION'

      - name: Run tests
        run: bundle exec rspec

      - name: Build rawfeed site
        run: bundle exec rawfeed build --destination .site_build

      - name: Build gem rawfeed
        run: gem build rawfeed.gemspec
