name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Bundle - Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Validate Ruby load
        run: bundle exec ruby -Ilib -e 'require "rawfeed"; puts Rawfeed::VERSION'

      - name: Run tests
        run: bundle exec rspec

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination .site_build

      - name: Build gem
        run: gem build rawfeed.gemspec
