{% include assigned %}
<!doctype html><html lang="{{ default.lang | default: 'en-US' }}" data-theme="dark">{% include layout/head.html %}<body><div class="wall" aria-hidden="true"></div><div class="container-fluid win"><header class="tbar"><p class="ttl"><span class="brand">{{ site_title | escape }}</span></p></header><main class="content" id="content">    <div class="panel maintenance">
      <div class="container">
        {%- if maintenance.gif != '' -%}
          <div class="row">
            <div class="col-sm text-center">
              <img
                class="maintenance-gif"
                src="{{ maintenance.gif | relative_url }}"
                alt="under maintenance">
            </div>
          </div>
        {%- endif -%}
        <div class="row mt-5 text-center">
          <h1 class="maintenance-title">[&nbsp;{{ maintenance.title }}&nbsp;]</h1>
        </div>
        <div class="row text-center">
          <h3 class="maintenance-subtitle">{{ maintenance.subtitle | markdownify }}</h3>
        </div>
      </div>
    </div>
</main>{% include layout/footer.html %}</div></body></html>
