# [ important!!! ] the base hostname & protocol for your site, e.g. http://example.com
url: "https://rawfeed.github.io"

# the subpath of your site, e.g. /blog
baseurl: ""

# ---------- CAUTION!!! DO NOT move from here unless you REALLY know what you are doing. -----------

theme: rawfeed
plugins:
  - jekyll-polyglot
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate-v2
  - rawfeed
# Add a locale here and provide Markdown documents with matching lang/page_id.
languages: [en, pt]
default_lang: en
lang_from_path: true
parallel_localization: false
serial_default_lang: true
exclude_from_localization:
  - assets/css
  - assets/js
  - assets/fonts
  - assets/vendors
  - sitemap.xml
  - feed.xml
collections:
  pixels:
    output: true
    permalink: /pixels/:title/
pagination:
  enabled: true
  debug: false
  collection: "posts"
  sort_field: "date"
  sort_reverse: true
  per_page: 50
  permalink: "/page/:num/"
  locale: ""
  title: ":title - Page :num"
  limit: 0
feed:
  path: /feed.xml
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      published: true
  - scope:
      path: "_pixels"
      type: "pixels"
    values:
      published: false
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: blog/posts_by_tag
  permalinks:
    tag: "/blog/tags/:name/"
include: ["_pages"]
permalink: "/blog/:title/"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  # syntax_highlighter_opts:
  #   line_numbers: true
sass:
  sass_dir: _sass
  style: compressed
exclude:
  - .bundle-cache
  - Gemfile
  - Rakefile
  - Gemfile.lock
  - README.md
  - RELEASE_CHECKLIST.md
  - CHANGELOG.md
  - CONTRIBUTING.md

  # files below: developer mode
  - node_modules
  - docs
  - spec
  - exe
  - rawfeed.gemspec
  - CODE_OF_CONDUCT.md
  - LICENSE
  - tmp
  - lib
  - pkg
